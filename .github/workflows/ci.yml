name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the C helpers
        run: make
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mqtt]"
      - name: Tests
        run: pytest -q
      # No radio in CI: hardware tests stay skipped (INSTEONRF_HW is unset).

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mqtt]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
