# insteon-rf V3 — an RTL-SDR Blog V3 as a third listener, receive only.
#
# Why this exists: the mesh is only worth having if its receivers fail
# independently, and this one fails differently from the other two. It is the
# only receiver that produces **soft decisions** — one signed byte of
# confidence per bit — so `fusion` can repair a damaged copy from this radio
# alone, where the dongle's and the Heltec's hard bits need two copies to vote
# with. It replaces the loaned RTL-SDR Blog V4 (2026-09-21 .. 09-29), which
# ran from this same manifest as receiver `v4`; history for that one stays
# under that name, this one publishes as `v3`.
#
# NEVER add a transmit path. There is exactly one transmitter on an Insteon
# network and it is the PLM. This backend cannot transmit in any case:
# SdrReceiver.transmit_bits raises.
#
# Hardware: RTL-SDR Blog V3 (0bda:2838, R820T2) with EEPROM serial
# **INST915**, on the 4-port hub at USB 1-11 alongside two more V3s --
# GAS910 (owned by the rtlamr2mqtt pod) and TPMS433 (spare). With three
# identical dongles the index is meaningless (it follows enumeration order),
# so the pod opens its own by serial: --device=INST915 -> `rtl_sdr -d`.
# Only that device is claimed; the others are opened just long enough to read
# their serial strings. List them with `rtl_test -d 99` (opens nothing).
#
# Gain 28.0, measured on this V3 where it sits (2026-10-03,
# tools/sdr_gain_sweep.py: one recording per gain under the same 36
# Get-Engine queries to 12 devices, scored against what the dongle and
# Heltec heard). 19.7-37.2 form a plateau; 12.5 loses copies (82%), 42.1
# and up lose messages (84-88%). 28.0 against 37.2 over three paired runs
# each: 95.5% vs 93.3% of messages (213 vs 208 of 223), weak-device ACKs
# 86% vs 83%, fewer syncs that fail to decode every time, and 70% of
# samples clipped per burst instead of 95%. Small, but never the other way.
#
# Uses the same locally built image as the other two pods, so
# imagePullPolicy MUST stay Never. See deploy/insteonrf.yaml for the build.
---
apiVersion: v1
kind: Pod
metadata:
  name: insteonrf-v3
  labels:
    app: insteonrf-v3
spec:
  restartPolicy: Always
  containers:
    - name: insteonrf-v3
      image: localhost/insteonrf:local
      imagePullPolicy: Never
      # privileged + /dev/bus/usb: librtlsdr drives the tuner over raw USB.
      securityContext:
        privileged: true
      env:
        - name: TZ
          value: "America/New_York"
        - name: INSTEONRF_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: username
        - name: INSTEONRF_MQTT_PASS
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: password
      args:
        - monitor
        - --backend=rtlsdr
        - --device=INST915
        # Tuned 40 kHz above the dongle's 914.950: this network sits there.
        # Two SDRs with independent 1 ppm TCXOs (the V4, then this V3) put
        # every device at the same offset to within ~1 kHz, +33..+48 kHz
        # from 914.950 (median +40), so it is the devices, not the tuner.
        # Centred, the spread is about +/-8 kHz, well inside the demod's
        # +/-56 kHz search instead of 8 kHz from its edge.
        - --freq=914990000
        - --gain=28.0
        # The C demodulator fails on real signals the numpy path decodes.
        - --demod=numpy
        - --mqtt=192.168.88.5:1883
        - --topic=insteon-rf
        # Per-packet MQTT is off for the same reason as the dongle pod: the
        # broker logs a line per publish. Captures still go to the mesh.
        - --mqtt-alerts-only
        - --mesh-capture=v3
        # The all-on watch lives in the dongle pod; this one is a receiver
        # for the mesh and its own record, nothing more.
        - --out=/config/log/insteon-rf-v3.jsonl
        # No silence watchdog: re-arming means nothing to this backend
        # (SdrReceiver.configure_rx is a no-op) and if rtl_sdr dies the pod
        # exits on `exhausted` and Kubernetes restarts it, which is the
        # recovery that actually applies here.
        - --max-silence=0
        - --quiet
        - -v
      resources:
        requests:
          memory: "256Mi"
        limits:
          # Demodulating 2.4 Msps of I/Q in numpy is the one CPU-hungry
          # receiver of the three.
          memory: "1Gi"
      volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /dev/bus/usb
          name: usb
  volumes:
    - name: config
      hostPath:
        # On nvme/churn, not nvme/k8s: this is a rotating log, which is
        # exactly the churn that made nvme/k8s snapshots expensive.
        path: /nvme/churn/insteonrf-v3
        type: Directory
    - name: usb
      hostPath:
        path: /dev/bus/usb
        type: Directory
