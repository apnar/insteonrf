# insteon-rf — independent Insteon 915 MHz RF listener (receive only).
#
# Why this exists: the PLM only passes up group broadcasts it holds an ALDB link
# for, so an unlinked ALL-Link broadcast to group 0 — the thing that turns every
# legacy device on at once — never reaches Home Assistant. That is why HA shows
# the lights as off during a phantom "all on", and why five months of
# insteon_mqtt.log contain no trigger for any of the three known events. This
# pod watches the air instead, with no such filter.
#
# On a trigger it writes the surrounding raw bursts plus an attribution report
# (hop counts identify the copy closest to the source, RSSI hints at distance)
# to /nvme/k8s/insteonrf-config/dumps, and publishes an alert to
# insteon-rf/alert for an automation to notify on. Per-packet MQTT is off: the
# rotating JSON-lines file at /nvme/k8s/insteonrf-config/log is the record.
#
# It is also a receiver for insteon-mqtt (Doc/REARCHITECTURE.md): every message
# it decodes, hop copies folded into one per transmission, goes out in listener
# contract v1 on insteon-rf/msg/dongle (--publish-decoded). It no longer
# publishes raw captures to insteon-rf/rx/dongle for the insteonrf-mesh pod.
#
# NEVER add a transmit command here: the PLM owns the air. Topic prefix is
# insteon-rf/ so it cannot collide with insteon-mqtt's insteon/ prefix.
#
# Image is built locally from /nvme/k8s/insteonrf-config/build and served by the
# local registry (registry.yaml). Shared by all three insteonrf-* pods:
#   cd /nvme/k8s/insteonrf-config/build && T=$(date +%Y%m%d) \
#     && buildah bud -t localhost:32000/insteonrf:$T . \
#     && buildah push --tls-verify=false localhost:32000/insteonrf:$T
# then bump the tag in insteonrf-dongle.yaml, insteonrf-v3.yaml, insteonrf-mesh.yaml.
#
# Pod renamed insteonrf → insteonrf-dongle on 2026-10-15 (pods are named for their
# receiver: dongle, v3, mesh).
#
# The dongle is exclusive: stop this pod before running insteon-rf by hand.
---
apiVersion: v1
kind: Pod
metadata:
  name: insteonrf-dongle
  labels:
    app: insteonrf-dongle
spec:
  restartPolicy: Always
  containers:
    - name: insteonrf-dongle
      image: localhost:32000/insteonrf:20261012
      imagePullPolicy: IfNotPresent
      # privileged + /dev/bus/usb: rflib drives the CC1111 over raw USB.
      securityContext:
        privileged: true
      env:
        - name: TZ
          value: "America/New_York"
        - name: INSTEONRF_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: username
        - name: INSTEONRF_MQTT_PASS
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: password
      args:
        - monitor
        - --mqtt=192.168.88.5:1883
        - --topic=insteon-rf
        # The JSON-lines file is the record. Nothing subscribes to a per-packet
        # stream, and this broker runs log_type debug (a line per publish), so
        # MQTT carries only all-on triggers, on insteon-rf/alert.
        - --mqtt-alerts-only
        # ...and decoded messages, listener contract v1, on
        # insteon-rf/msg/dongle: one per transmission (hop copies folded over
        # 0.5 s of air time), in the PLM's frame layout, after hard-bit
        # CRC-guided repair (repaired = bits changed; never injected when
        # non-zero). rssi is null: the dongle's figure is a register snapshot
        # taken after its 224 ms block, mostly the channel floor.
        # Replaces --mesh-capture=dongle (raw captures to insteon-rf/rx/dongle
        # for the insteonrf-mesh pod, which is being retired).
        - --publish-decoded=dongle
        # The dongle goes deaf without erroring, mid-run, while still
        # answering register reads and still reporting MARC_STATE_RX with a
        # correct modem configuration and a normal noise floor. Re-arming
        # receive is the only thing measured to bring it back, so do it after
        # 20 s of silence rather than the 5 min it used to wait: on
        # 2026-09-21 it spent three quarters of the day deaf, in spells that
        # began the moment a busy exchange ended.
        #
        # The USB reset that used to follow at 10 min is gone. Over that same
        # day only 8 of 128 resets were followed by a decode inside a minute
        # (median wait: half an hour) while the dongle was re-enumerated 200
        # times for nothing. A reset now happens only if the dongle stops
        # answering altogether, which --diag-after decides.
        - --max-silence=20
        # A different staleness: after a second or two of quiet the CC1111
        # loses the first copy of the next burst. Strobing IDLE -> RX after
        # 1 s with no block took first copies after silence from 88.6% to
        # 98.2% (ABBA x2, 2026-10-11). It is the monitor's default; spelled
        # out here because it is the reason the first copy is caught.
        - --idle-rearm=1
        - --diag-after=300
        - --out=/config/log/insteon-rf.jsonl
        - --watch-all-on
        - --known-groups=/config/groups.txt
        - --dump-dir=/config/dumps
        - --unknown-commands
        - --quiet
        - -v
      volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /dev/bus/usb
          name: usb
  volumes:
    - name: config
      hostPath:
        path: /nvme/k8s/insteonrf-config
        type: Directory
    - name: usb
      hostPath:
        path: /dev/bus/usb
        type: Directory
