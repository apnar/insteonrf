# insteon-rf — independent Insteon 915 MHz RF listener (receive only).
#
# Why this exists: the PLM only passes up group broadcasts it holds an ALDB link
# for, so an unlinked ALL-Link broadcast to group 0 — the thing that turns every
# legacy device on at once — never reaches Home Assistant. That is why HA shows
# the lights as off during a phantom "all on", and why five months of
# insteon_mqtt.log contain no trigger for any of the three known events. This
# pod watches the air instead, with no such filter.
#
# On a trigger it writes the surrounding raw bursts plus an attribution report
# (hop counts identify the copy closest to the source, RSSI hints at distance)
# to /nvme/k8s/insteonrf-config/dumps, and publishes an alert to
# insteon-rf/alert for an automation to notify on. Per-packet MQTT is off: the
# rotating JSON-lines file at /nvme/k8s/insteonrf-config/log is the record.
#
# NEVER add a transmit command here: the PLM owns the air. Topic prefix is
# insteon-rf/ so it cannot collide with insteon-mqtt's insteon/ prefix.
#
# Image is built locally from /nvme/k8s/insteonrf-config/build (buildah bud →
# ctr image import), so imagePullPolicy MUST stay Never:
#   cd /nvme/k8s/insteonrf-config/build && buildah bud -t insteonrf:local . \
#     && buildah push localhost/insteonrf:local \
#          docker-archive:/var/tmp/insteonrf.tar:localhost/insteonrf:local \
#     && microk8s ctr image import /var/tmp/insteonrf.tar
#
# The dongle is exclusive: stop this pod before running insteon-rf by hand.
---
apiVersion: v1
kind: Pod
metadata:
  name: insteonrf
  labels:
    app: insteonrf
spec:
  restartPolicy: Always
  containers:
    - name: insteonrf
      image: localhost/insteonrf:local
      imagePullPolicy: Never
      # privileged + /dev/bus/usb: rflib drives the CC1111 over raw USB.
      securityContext:
        privileged: true
      env:
        - name: TZ
          value: "America/New_York"
        - name: INSTEONRF_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: username
        - name: INSTEONRF_MQTT_PASS
          valueFrom:
            secretKeyRef:
              name: mosquitto
              key: password
      args:
        - monitor
        - --mqtt=192.168.88.5:1883
        - --topic=insteon-rf
        # The JSON-lines file is the record. Nothing subscribes to a per-packet
        # stream, and this broker runs log_type debug (a line per publish), so
        # MQTT carries only all-on triggers, on insteon-rf/alert.
        - --mqtt-alerts-only
        # ...except raw captures, which make this dongle a member of the
        # listener mesh that the insteonrf-mesh pod fuses.
        - --mesh-capture=dongle
        # The dongle goes deaf without erroring (five times on 2026-09-19,
        # ~5 h of a 7 h day, confirmed against the Heltec's log); a USB reset
        # cures it. Re-arm after 5 min of silence, USB-reset after 10.
        - --max-silence=300
        - --out=/config/log/insteon-rf.jsonl
        - --watch-all-on
        - --known-groups=/config/groups.txt
        - --dump-dir=/config/dumps
        - --unknown-commands
        - --quiet
        - -v
      volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /dev/bus/usb
          name: usb
  volumes:
    - name: config
      hostPath:
        path: /nvme/k8s/insteonrf-config
        type: Directory
    - name: usb
      hostPath:
        path: /dev/bus/usb
        type: Directory
