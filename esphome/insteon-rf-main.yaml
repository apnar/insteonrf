# Insteon RF listener node. Receive only — see Doc/MESH-PLAN.md.
#
# Board: Heltec LoRa 32 V3 (ESP32-S3 + SX1262). Pins verified 2026-09-19
# against Meshtastic's heltec_v3 variant and arduino-esp32's board definition
# (radio: SCK 9, MISO 11, MOSI 10, CS 8, RESET 12, BUSY 13, DIO1 14; TCXO
# 1.8 V on DIO3; DIO2 as RF switch. OLED: SDA 17, SCL 18, RST 21, powered via
# Vext on GPIO36, active low).
#
# Bring-up: the first ten captures after boot are logged at INFO with their
# leading bytes and the gate verdict, so `esphome logs` tells the story:
#   - "sync word readback mismatch" at boot -> CS/MISO/MOSI wiring
#   - no captures at all while the rfcat dongle hears traffic
#       -> flip sync_word to the complement, 0xCCCCCEAA (bit sense inverted)
#       -> if still nothing, try preamble_detector_bits: 8
#   - captures arriving but "gate fail" on all of them -> framing/polarity;
#     send me the logged bytes
#   - captures with "gate PASS" -> it works; watch insteon-rf/rx/<name>
#
# The OLED shows the same story without a laptop, which is what makes it
# useful for the placement survey: carry the board around and watch RSSI and
# accepted-per-minute.
#
# Deliberately NOT including common/ble-proxy.yaml. WiFi + BLE + continuous
# SPI FIFO service on one ESP32-S3 risks the interrupt latency that drops
# captures; revisit only once the receive path has been stable for weeks.

substitutions:
  name: insteon-rf-main
  friendly_name: Insteon RF Main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Reported as the "Project Version" sensor, and the only version this board
  # publishes that means anything. ESPHome's own build_time_str is frozen
  # until the config hash changes, so a reflash of unchanged config keeps the
  # original timestamp -- the board was still announcing a build time from
  # four days earlier after today's OTA. Keep this equal to the Python
  # package's version (insteonrf/_version.py) and bump both together, so
  # "what is this board running" has one answer.
  project:
    name: insteonrf.listener
    version: "2.8.1"
  on_boot:
    # Vext (the OLED's supply) is switched on at HARDWARE priority; give the
    # panel a moment before the display driver resets it at PROCESSOR.
    - priority: 600.0
      then:
        - delay: 50ms

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

packages:
  wifi: !include common/wifi.yaml

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_pass

# The mesh service consumes MQTT directly, not the HA API, so this node needs
# both. Topic prefix is insteon-rf/ so it cannot collide with insteon-mqtt's
# insteon/ prefix.
mqtt:
  broker: 192.168.88.5
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  topic_prefix: insteon-rf/${name}

time:
  - platform: sntp
    id: sntp_time

external_components:
  - source:
      type: local
      path: components
    components: [insteon_rf]

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

insteon_rf:
  id: rf
  cs_pin: GPIO8
  reset_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  tcxo_voltage: 1.8V
  frequency: 914.95MHz
  # From tools/gen_sync_word.py; complement is 0xCCCCCEAA (see bring-up above).
  sync_word: 0x33333155
  preamble_detector_bits: 0
  capture_bytes: 162
  rssi_floor: -110
  manchester_gate: 4
  mqtt_topic: insteon-rf/rx/${name}

# ---------------------------------------------------------------- on-board OLED

# Vext powers the OLED (and nothing else we use). Active low, so the pin is
# inverted and "on" drives it low. Internal: not an entity anyone should flip.
switch:
  - platform: gpio
    id: vext
    internal: true
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_ON

i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: f_small
    size: 11
  - file: "gfonts://Roboto"
    id: f_big
    size: 20

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 500ms
    lambda: |-
      // Not `rf`: a local of that name would shadow the id() lookup.
      auto *node = id(rf);  // id() yields a pointer
      const bool wifi_ok = wifi::global_wifi_component != nullptr &&
                           wifi::global_wifi_component->is_connected();
      const bool mqtt_ok = mqtt::global_mqtt_client != nullptr &&
                           mqtt::global_mqtt_client->is_connected();

      // Title row: name, and W/M flags (upper case = connected).
      it.print(0, 0, id(f_small), "${friendly_name}");
      it.printf(128, 0, id(f_small), TextAlign::TOP_RIGHT, "%s%s",
                wifi_ok ? "W" : "w", mqtt_ok ? "M" : "m");

      if (!node->radio_ok()) {
        it.print(64, 34, id(f_big), TextAlign::CENTER, "RADIO FAULT");
        it.print(64, 54, id(f_small), TextAlign::CENTER, "check SPI wiring");
        return;
      }

      // Signal row: RSSI of the last real Insteon packet, big, plus a bar.
      // -110 dBm is the floor, -50 dBm is standing next to the transmitter.
      const float rssi = node->last_accepted_rssi();
      if (std::isnan(rssi)) {
        it.print(0, 14, id(f_big), "--- dBm");
      } else {
        it.printf(0, 14, id(f_big), "%.0f dBm", rssi);
        int w = (int) ((rssi + 110.0f) / 60.0f * 128.0f);
        if (w < 0) w = 0;
        if (w > 128) w = 128;
        it.filled_rectangle(0, 36, w, 3);
      }

      // Rates: what the gate is doing. Captures without accepts = noise or a
      // polarity problem; accepts = real packets.
      it.printf(0, 41, id(f_small), "%u cap/min  %u ok/min",
                (unsigned) node->captures_last_minute(),
                (unsigned) node->accepted_last_minute());

      // Age of the last real packet, and lifetime accepted count.
      const uint32_t age = node->ms_since_accepted();
      if (age == UINT32_MAX) {
        it.print(0, 53, id(f_small), "no packet yet");
      } else if (age < 60000) {
        it.printf(0, 53, id(f_small), "last %us ago", (unsigned) (age / 1000));
      } else {
        it.printf(0, 53, id(f_small), "last %um ago", (unsigned) (age / 60000));
      }
      it.printf(128, 53, id(f_small), TextAlign::TOP_RIGHT, "n=%u",
                (unsigned) node->total_accepted());

sensor:
  - platform: insteon_rf
    insteon_rf_id: rf
    last_rssi:
      name: ${friendly_name} Last RSSI
    captures_per_minute:
      name: ${friendly_name} Captures
    accepted_per_minute:
      name: ${friendly_name} Accepted
  - platform: uptime
    name: ${friendly_name} Uptime
    update_interval: 60s

text_sensor:
  - platform: version
    name: ${friendly_name} ESPHome Version
  # The repo version this firmware was built from. ESPHome's own build_time
  # only moves when the config hash changes, so it cannot answer "is this
  # board running current code" on its own; this can. Matches
  # insteonrf/_version.py -- bump both together.
  - platform: template
    name: ${friendly_name} Firmware Version
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {ESPHOME_PROJECT_VERSION};'

button:
  - platform: restart
    name: ${friendly_name} Restart
    entity_category: diagnostic
